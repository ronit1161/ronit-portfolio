  <text x="50" y="242" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="10">State Machine: Created → In-Progress → Review</text>
  <text x="50" y="256" fill="#3b82f6" font-family="'JetBrains Mono', monospace" font-size="9">Transitions validate actor permissions &amp; balance</text>

  <!-- Module 3: Escrow & Wallet Ledger -->
  <rect x="36" y="278" width="318" height="68" rx="3" fill="#1a1d28" stroke="#2c3245" stroke-width="1" />
  <text x="50" y="302" fill="#f3f4f6" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Escrow &amp; Virtual Wallet Core</text>
  <text x="50" y="322" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="10">Transactional Fund Hold &amp; Release Engine</text>
  <text x="50" y="336" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="9">ACID Guarantee · Double-Entry Ledger</text>

  <!-- Module 4: MySQL Data Persistence -->
  <rect x="36" y="358" width="318" height="84" rx="3" fill="#1a1d28" stroke="#2c3245" stroke-width="1" />
  <text x="50" y="380" fill="#f3f4f6" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Relational Database Layer</text>
  <text x="50" y="400" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="10">Users · Gigs · Orders · WalletLedgers · Reviews</text>
  <text x="50" y="424" fill="#6b7280" font-family="'JetBrains Mono', monospace" font-size="9">Spring Data JPA · Hibernate · MySQL 8.0 InnoDB</text>

