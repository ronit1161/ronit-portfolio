<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="100%" height="100%">
  <!-- Matte Dark Blueprint Canvas -->
  <rect width="760" height="480" rx="4" fill="#13151b" stroke="#1f2330" stroke-width="1.5" />

  <!-- Top Bar -->
  <rect x="20" y="20" width="720" height="38" rx="3" fill="#181b24" stroke="#252b3b" stroke-width="1" />
  <circle cx="38" cy="39" r="4" fill="#4b5563" />
  <circle cx="52" cy="39" r="4" fill="#4b5563" />
  <circle cx="66" cy="39" r="4" fill="#4b5563" />
  <text x="88" y="43" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="500">FREELANCE_MARKETPLACE // ARCHITECTURE_SCHEMATIC</text>
  <text x="630" y="43" fill="#3b82f6" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">SPRING BOOT</text>

