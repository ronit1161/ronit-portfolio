  <text x="468" y="142" fill="#d1d5db" font-family="'JetBrains Mono', monospace" font-size="11">/api/v1/orders/checkout</text>

  <!-- Endpoint 2 -->
  <rect x="406" y="168" width="318" height="42" rx="3" fill="#1a1d28" stroke="#252b3b" stroke-width="1" />
  <rect x="414" y="176" width="44" height="24" rx="2" fill="#1e222e" stroke="#374151" stroke-width="1" />
  <text x="424" y="192" fill="#3b82f6" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">GET</text>
  <text x="468" y="192" fill="#d1d5db" font-family="'JetBrains Mono', monospace" font-size="11">/api/v1/gigs?category=backend</text>

  <!-- Endpoint 3 -->
  <rect x="406" y="218" width="318" height="42" rx="3" fill="#1a1d28" stroke="#252b3b" stroke-width="1" />
  <rect x="414" y="226" width="44" height="24" rx="2" fill="#1e222e" stroke="#374151" stroke-width="1" />
  <text x="424" y="242" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">PUT</text>
  <text x="468" y="242" fill="#d1d5db" font-family="'JetBrains Mono', monospace" font-size="11">/api/v1/orders/{id}/deliver</text>

  <!-- Technical Summary Stats -->
  <rect x="406" y="278" width="152" height="74" rx="3" fill="#181b24" stroke="#252b3b" stroke-width="1" />
  <text x="418" y="300" fill="#6b7280" font-family="'JetBrains Mono', monospace" font-size="9" text-transform="uppercase">Pattern</text>
  <text x="418" y="322" fill="#f3f4f6" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Modular Monolith</text>
  <text x="418" y="338" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="10">Clean boundaries</text>

  <rect x="572" y="278" width="152" height="74" rx="3" fill="#181b24" stroke="#252b3b" stroke-width="1" />
  <text x="584" y="300" fill="#6b7280" font-family="'JetBrains Mono', monospace" font-size="9" text-transform="uppercase">Security</text>
  <text x="584" y="322" fill="#3b82f6" font-family="'Inter', sans-serif" font-size="13" font-weight="600">JWT + RBAC</text>
  <text x="584" y="338" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="10">Spring Security</text>

  <!-- Code Snapshot -->
  <rect x="406" y="364" width="318" height="78" rx="3" fill="#0f1117" stroke="#1f2330" stroke-width="1" />
  <text x="418" y="386" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="10">@Transactional</text>
  <text x="418" y="404" fill="#e5e7eb" font-family="'JetBrains Mono', monospace" font-size="10">public void completeOrder(Long id) {</text>
  <text x="432" y="422" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="10">  walletService.releaseEscrow(id);</text>
  <text x="418" y="434" fill="#e5e7eb" font-family="'JetBrains Mono', monospace" font-size="10">}</text>
</svg>
