  <text x="36" y="102" fill="#e5e7eb" font-family="'Inter', sans-serif" font-size="12" font-weight="600">DOMAIN MODULES</text>
  <text x="250" y="102" fill="#6b7280" font-family="'JetBrains Mono', monospace" font-size="10">MODULAR CORE</text>

  <!-- Module 1: Auth -->
  <rect x="36" y="118" width="318" height="68" rx="3" fill="#1a1d28" stroke="#2c3245" stroke-width="1" />
  <text x="50" y="142" fill="#f3f4f6" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Auth &amp; Security Module</text>
  <text x="50" y="162" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="10">Spring Security · Stateless JWT Filters · RBAC</text>
  <text x="50" y="176" fill="#6b7280" font-family="'JetBrains Mono', monospace" font-size="9">Roles: CLIENT · FREELANCER · ADMIN</text>

  <!-- Module 2: Order Lifecycle -->
  <rect x="36" y="198" width="318" height="68" rx="3" fill="#1a1d28" stroke="#2c3245" stroke-width="1" />
