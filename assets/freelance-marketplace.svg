  <rect x="406" y="118" width="318" height="42" rx="3" fill="#1a1d28" stroke="#252b3b" stroke-width="1" />
  <rect x="414" y="126" width="44" height="24" rx="2" fill="#1e222e" stroke="#374151" stroke-width="1" />
